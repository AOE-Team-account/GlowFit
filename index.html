<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlowFit – Free Daily Workouts</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GlowFit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffe3ea">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f3;--card:#fff;--ink:#2b2234;--mut:#8d8498;--pk:#ff5c7c;--pk2:#ff8fa6;--soft:#ffe6eb;--mint:#4fcfb1;--gold:#ffc24b;--line:#f3e4e8;--fig:#2b2234;--figfar:#a69cb2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(160deg,#ffe3ea,#fff1e4 55%,#e4faf3);font-family:Nunito,system-ui,sans-serif;color:var(--ink);min-height:100%}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
#app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:96px;box-shadow:0 0 70px rgba(255,92,124,.15)}
.pad{padding:18px 18px 8px}
h1,h2,h3{margin:0;line-height:1.15}
.sub{color:var(--mut);font-weight:600;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hi{font-size:24px;font-weight:900}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:7px 12px;font-weight:800;font-size:13px}
.pill.pk{background:var(--soft);border-color:#ffd0da;color:#d63a5c}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--pk),#ff7f6e);color:#fff;font-weight:900;font-size:17px;padding:16px;border-radius:99px;box-shadow:0 8px 20px rgba(255,92,124,.35);text-align:center;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.mint{background:linear-gradient(135deg,#4fcfb1,#38b6d6);box-shadow:0 8px 20px rgba(79,207,177,.35)}
.btn.sm{font-size:14px;padding:11px 16px;width:auto;display:inline-block}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 24px rgba(120,60,80,.07);margin-bottom:14px}
.figbox{background:linear-gradient(180deg,#fff,#ffeef2);border-radius:22px;overflow:hidden;position:relative}
.figbox svg{display:block;width:100%;height:auto}
.hero{padding:0;overflow:hidden}
.hero .in{padding:16px}
.tag{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--pk)}
.hero h2{font-size:26px;margin:4px 0 6px;font-weight:900}
.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--mut);font-weight:700;font-size:14px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--soft);color:#d63a5c;font-weight:800;font-size:12px;padding:5px 10px;border-radius:99px}
.row{display:flex;gap:8px;align-items:center}
.week{display:flex;justify-content:space-between;gap:4px}
.wd{flex:1;text-align:center;font-size:11px;font-weight:800;color:var(--mut)}
.wd i{display:flex;margin:5px auto 0;width:34px;height:34px;border-radius:50%;background:#f6eef0;align-items:center;justify-content:center;font-style:normal;font-size:15px;color:#fff}
.wd.on i{background:linear-gradient(135deg,var(--pk),#ff7f6e)}
.wd.today i{outline:2.5px solid var(--pk);outline-offset:2px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);background:#fff;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(120,60,80,.08);border-radius:24px 24px 0 0;z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--mut);padding:6px}
.nav button span{font-size:22px;filter:grayscale(1);opacity:.55}
.nav button.on{color:var(--pk)}
.nav button.on span{filter:none;opacity:1}
.list .it{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.list .it:last-child{border:0}
.list .th{width:76px;flex:none;border-radius:14px;background:linear-gradient(180deg,#fff,#ffeef2);overflow:hidden}
.list .th svg{display:block;width:100%}
.list b{font-size:15px;display:block}
.list small{color:var(--mut);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.day{aspect-ratio:1;border-radius:18px;background:#fff;box-shadow:0 4px 14px rgba(120,60,80,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;position:relative;font-size:17px}
.day small{font-size:10px;color:var(--mut);font-weight:800}
.day .e{font-size:18px}
.day.done{background:linear-gradient(135deg,#ffd9e1,#ffeadf)}
.day.done:after{content:'✓';position:absolute;top:4px;right:7px;color:var(--pk);font-size:13px}
.day.cur{outline:3px solid var(--pk);outline-offset:1px}
.day.lock{opacity:.4}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.med{background:#fff;border-radius:20px;padding:10px 6px 12px;text-align:center;box-shadow:0 4px 14px rgba(120,60,80,.07)}
.med b{display:block;font-size:12px;margin-top:2px;line-height:1.15}
.med small{display:block;font-size:10px;color:var(--mut);font-weight:700;margin-top:2px}
.bar{height:6px;border-radius:9px;background:#f3e6ea;margin:6px 8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),#ff9f7e)}
.opt{display:flex;align-items:center;gap:14px;background:#fff;border:2.5px solid transparent;border-radius:20px;padding:14px;margin-bottom:10px;width:100%;text-align:left;box-shadow:0 4px 14px rgba(120,60,80,.06)}
.opt.on{border-color:var(--pk);background:#fff3f5}
.opt .ic{font-size:28px;width:44px;text-align:center;flex:none}
.opt b{font-size:16px;display:block}
.opt small{color:var(--mut);font-weight:700;font-size:13px}
.zg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zg .opt{flex-direction:column;text-align:center;gap:4px;margin:0;padding:16px 8px}
.ob{padding:22px 20px 30px;min-height:100vh;display:flex;flex-direction:column}
.ob h1{font-size:28px;font-weight:900;margin:10px 0 6px}
.ob .grow{flex:1}
.dots{display:flex;gap:6px;margin-bottom:6px}
.dots i{height:5px;flex:1;border-radius:9px;background:#f0dfe4}
.dots i.on{background:var(--pk)}
.back{font-size:22px;padding:4px 8px 4px 0;color:var(--mut);font-weight:900}
input.tx{width:100%;font:inherit;font-weight:800;font-size:18px;padding:16px;border-radius:18px;border:2.5px solid var(--line);background:#fff;outline:0}
input.tx:focus{border-color:var(--pk)}
textarea.tx{width:100%;font:12px monospace;height:90px;border-radius:12px;border:2px solid var(--line);padding:8px}
#layer,#modal{position:fixed;inset:0;z-index:20;pointer-events:none}
#layer>*,#modal>*{pointer-events:auto}
#modal{z-index:40}
.sheetbg{position:fixed;inset:0;background:rgba(43,34,52,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:min(460px,100%);background:#fff;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .25s}
.sheet h3{font-size:20px;font-weight:900;margin-bottom:12px}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#eadde1;margin:-8px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}70%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.player{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;max-width:460px;margin:0 auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
.player.rest{background:#eefaf6}
.ptop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ptop .x{font-size:20px;font-weight:900;width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.prog{flex:1;height:8px;background:#f0dfe4;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),#ff9f7e);transition:width .4s}
.player.rest .prog i{background:var(--mint)}
.pname{text-align:center;font-size:26px;font-weight:900;margin:12px 0 2px}
.ptip{text-align:center;color:var(--mut);font-weight:700;font-size:14px;min-height:40px;padding:0 10px}
.ring{position:relative;width:128px;height:128px;margin:10px auto}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900}
.ctl{display:flex;justify-content:center;gap:22px;align-items:center;margin-top:6px}
.ctl button{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.1);font-size:20px;font-weight:900}
.ctl button.big{width:72px;height:72px;font-size:28px;background:linear-gradient(135deg,var(--pk),#ff7f6e);color:#fff}
.next{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 12px;margin-top:auto;font-weight:800}
.next .th{width:64px;border-radius:12px;overflow:hidden;background:#fff0f3}
.next small{display:block;color:var(--mut);font-size:11px}
.big-n{font-size:84px;font-weight:900;text-align:center;line-height:1}
.sum{text-align:center}
.sum h1{font-size:30px;font-weight:900;margin:6px 0}
.stats{display:flex;gap:10px;margin:16px 0}
.stats div{flex:1;background:#fff;border-radius:18px;padding:12px 4px;box-shadow:0 4px 14px rgba(120,60,80,.07)}
.stats b{display:block;font-size:22px;font-weight:900}
.stats small{color:var(--mut);font-weight:800;font-size:11px}
.fb{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.fb button{background:#fff;border:2px solid var(--line);border-radius:99px;padding:9px 14px;font-weight:800;font-size:13px}
.fb button.on{border-color:var(--pk);background:var(--soft)}
.newm{animation:pop .7s both}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:99px;background:#fff;font-weight:800;font-size:13px;border:2px solid var(--line)}
.tabs button.on{background:var(--pk);border-color:var(--pk);color:#fff}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lib button{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(120,60,80,.07);text-align:left}
.lib button b{display:block;padding:6px 10px 0;font-size:13px}
.lib button small{display:block;padding:0 10px 8px;color:var(--mut);font-weight:700;font-size:11px}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-weight:800}
.set small{color:var(--mut);font-weight:700;display:block;font-size:12px}
.tog{width:46px;height:28px;border-radius:99px;background:#e6dce0;position:relative;flex:none}
.tog:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--pk)}
.tog.on:after{left:21px}
.mat{fill:#ffc9d6}
a{color:var(--pk);font-weight:800}
.note{font-size:12px;color:var(--mut);font-weight:700;line-height:1.4}
canvas.conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:10px;font-weight:800;color:var(--mut)}
.bars i{display:block;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--pk),#ff9f7e);min-height:4px;margin-bottom:4px}
.mv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mv button{background:#fff3f5;border-radius:16px;padding:10px 4px;font-weight:800;font-size:12px}
.mv button span{display:block;font-size:24px}
.kc{display:flex;gap:8px}
.kc div{flex:1;text-align:center;background:#fff;border-radius:16px;padding:10px 4px;box-shadow:0 4px 14px rgba(120,60,80,.06)}
.kc b{display:block;font-size:20px;font-weight:900}.kc small{font-size:10px;color:var(--mut);font-weight:800}
.wbig{font-size:34px;font-weight:900}
.seg{display:flex;background:#f6eef0;border-radius:99px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:99px;font-weight:800;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--pk)}
.srch{width:100%;font:inherit;font-weight:700;padding:11px 14px;border-radius:99px;border:2px solid var(--line);background:#fff;outline:0;margin-bottom:10px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.hrow button{color:var(--mut);padding:4px 8px}
.tm{font-size:64px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#2b2234;color:#fff;padding:12px 18px;border-radius:99px;font-weight:800;font-size:14px;z-index:60;animation:fade .2s;white-space:nowrap}
</style>

<script>
'use strict';
/* ================= STICK FIGURE ENGINE ================= */
const D=Math.PI/180, NS='http://www.w3.org/2000/svg';
const lerp=(a,b,u)=>a+(b-a)*u;
// Pose: f(front view 0/1), h hip [x,y], t torso angle, s spine bend, d head angle, a arms [L1,L2,R1,R2], l legs [L1,L2,R1,R2]
// angle: 0 = down, 90 = right, 180 = up, -90 = left
const mk=(b,o)=>{const p={...b,...o};if(p.d==null)p.d=p.t+(p.s||0);return p;};
const ST={f:1,h:[80,68],t:180,s:0,a:[0,0,0,0],l:[0,0,0,0]};
const SDb={...ST,f:0};
const LYb={f:0,h:[52,105],t:90,s:0,a:[-90,-90,-90,-90],l:[-90,-90,-90,-90]};
const QDb={f:0,h:[52,89],t:106,s:0,a:[0,0,0,0],l:[0,-90,0,-90]};
const PLb={f:0,h:[52,92],t:115,s:0,a:[0,0,0,0],l:[-65,-65,-65,-65]};
const FPb={f:0,h:[52,100],t:104,s:0,a:[0,90,0,90],l:[-76,-76,-76,-76]};
const PRb={f:0,h:[52,105],t:90,s:0,a:[60,-20,60,-20],l:[-90,-90,-90,-90]};
const SIb={f:0,h:[90,105],t:180,s:0,a:[0,0,0,0],l:[-90,-90,-90,-90]};
const KNb={f:0,h:[50,100],t:180,s:0,a:[0,0,0,0],l:[82,-90,82,-90]};
const SF=o=>mk(ST,o),SD=o=>mk(SDb,o),LY=o=>mk(LYb,o),QD=o=>mk(QDb,o),PL=o=>mk(PLb,o),FP=o=>mk(FPb,o),PR=o=>mk(PRb,o),SI=o=>mk(SIb,o),KN=o=>mk(KNb,o);
const mir=p=>({f:p.f,h:[160-p.h[0],p.h[1]],t:360-p.t,s:-p.s,d:360-p.d,a:[-p.a[2],-p.a[3],-p.a[0],-p.a[1]],l:[-p.l[2],-p.l[3],-p.l[0],-p.l[1]]});

function solve(p){
  const sw=6*p.f,hw=4*p.f,[hx,hy]=p.h;
  const a1=p.t*D,a2=(p.t+p.s)*D;
  const mid=[hx+14*Math.sin(a1),hy+14*Math.cos(a1)];
  const neck=[mid[0]+14*Math.sin(a2),mid[1]+14*Math.cos(a2)];
  const hd=p.d*D;
  const head=[neck[0]+10.5*Math.sin(hd),neck[1]+10.5*Math.cos(hd)];
  const limb=(o,a,b,l1,l2)=>{const j=[o[0]+l1*Math.sin(a*D),o[1]+l1*Math.cos(a*D)];return [o,j,[j[0]+l2*Math.sin(b*D),j[1]+l2*Math.cos(b*D)]]};
  return {hip:[hx,hy],mid,neck,head,hd,
    aL:limb([neck[0]-sw,neck[1]],p.a[0],p.a[1],15,14),aR:limb([neck[0]+sw,neck[1]],p.a[2],p.a[3],15,14),
    lL:limb([hx-hw,hy],p.l[0],p.l[1],21,21),lR:limb([hx+hw,hy],p.l[2],p.l[3],21,21)};
}
function blend(p,q,u){return{f:lerp(p.f,q.f,u),h:[lerp(p.h[0],q.h[0],u),lerp(p.h[1],q.h[1],u)],t:lerp(p.t,q.t,u),s:lerp(p.s,q.s,u),d:lerp(p.d,q.d,u),a:p.a.map((v,i)=>lerp(v,q.a[i],u)),l:p.l.map((v,i)=>lerp(v,q.l[i],u))}}
const el=(n,at,par)=>{const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);par&&par.appendChild(e);return e};
const figs=new Set();
let _vis=null;const VIS=()=>_vis||(_vis=new IntersectionObserver(es=>es.forEach(e=>{if(e.target._f)e.target._f.hidden=!e.isIntersecting}),{rootMargin:'120px'}));
function mountFig(host,ex){
  host.innerHTML='';
  const svg=el('svg',{viewBox:'0 0 160 120'});host.appendChild(svg);
  const floor=ex.pos!=='st';
  if(floor)el('rect',{x:6,y:107.5,width:148,height:6,rx:3,class:'mat'},svg);
  else el('line',{x1:10,x2:150,y1:111,y2:111,stroke:'#f2d6dd','stroke-width':2,'stroke-linecap':'round'},svg);
  if(ex.wall)el('line',{x1:ex.wall===true?106:ex.wall,x2:ex.wall===true?106:ex.wall,y1:8,y2:111,stroke:'#e2c9d1','stroke-width':5,'stroke-linecap':'round'},svg);
  const sh=el('ellipse',{cx:80,cy:112.5,rx:20,ry:2.4,fill:'rgba(120,60,80,.12)'},svg);
  const mkl=(c,w)=>el('polyline',{fill:'none',stroke:c,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'},svg);
  const FAR='#a99fb5',NEAR='#2b2234';
  const aL=mkl(FAR,4.4),lL=mkl(FAR,5),torso=mkl(NEAR,6),lR=mkl(NEAR,5),aR=mkl(NEAR,4.4);
  const head=el('circle',{r:6.6,fill:'#fff',stroke:NEAR,'stroke-width':3.2},svg);
  const bow=el('circle',{r:2.6,fill:'#ff5c7c'},svg);
  const n=ex.fr.length,sp=ex.sp,hold=ex.hold;
  const f={svg,clock:Math.random()*sp*0.0,last:null,paused:false,ex};
  const pts=a=>a.map(p=>p[0].toFixed(1)+','+Math.min(p[1],110.5).toFixed(1)).join(' ');
  f.draw=(now)=>{
    if(f.last==null)f.last=now;const dt=Math.max(0,Math.min(.1,now-f.last));f.last=now;if(!f.paused)f.clock+=dt;
    const pos=((f.clock/sp)%1)*n,i=Math.floor(pos),k=pos-i;
    const e=hold?(()=>{const x=Math.min(1,Math.max(0,(k-.2)/.6));return x*x*(3-2*x)})():(1-Math.cos(Math.PI*k))/2;
    const p=blend(ex.fr[i%n],ex.fr[(i+1)%n],e),q=solve(p);
    aL.setAttribute('points',pts(q.aL));lL.setAttribute('points',pts(q.lL));
    torso.setAttribute('points',pts([q.hip,q.mid,q.neck]));
    lR.setAttribute('points',pts(q.lR));aR.setAttribute('points',pts(q.aR));
    head.setAttribute('cx',q.head[0]);head.setAttribute('cy',Math.min(q.head[1],104));
    const bd=(q.hd+65)*D;bow.setAttribute('cx',q.head[0]+7.4*Math.sin(bd));bow.setAttribute('cy',Math.min(q.head[1],104)+7.4*Math.cos(bd));
    let maxY=0;for(const L of [q.lL,q.lR,q.aL,q.aR])maxY=Math.max(maxY,L[2][1]);
    const air=Math.max(0,110.5-maxY);sh.setAttribute('rx',Math.max(8,20-air*.35));sh.setAttribute('opacity',Math.max(.3,1-air/40));
  };
  f.draw(performance.now()/1000);figs.add(f);
  if(typeof IntersectionObserver!=='undefined'){host._f=f;VIS().observe(host)}
  return f;

const ymd=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function streaks(){
  const days=[...new Set(S.log.filter(l=>l.type!=='cool').map(l=>ymd(l.ts)))].sort();
  let best=0,run=0,prev=null;for(const d of days){run=(prev&&dayDiff(prev,d)===1)?run+1:1;best=Math.max(best,run);prev=d}
  let cur=0,d=new Date();if(!days.includes(ymd(d)))d.setDate(d.getDate()-1);
  while(days.includes(ymd(d))){cur++;d.setDate(d.getDate()-1)}

}

/* ================= WORKOUT BUILDER ================= */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const cache={};
function zonesList(){return S.zones.length?S.zones:Object.keys(ZONES)}
function pickEx(pool,zone,used,rng,lv){
  let c=pool.filter(e=>e.lv<=lv&&e.z.includes(zone)&&!used.has(e.id));
  if(!c.length)c=pool.filter(e=>e.lv<=lv&&!used.has(e.id));
  if(!c.length)c=pool.filter(e=>e.lv<=lv);
  const w=c.map(e=>1+(e.lv===lv?1:0)+(e.z[0]===zone?1:0));let r=rng()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<c.length;i++){r-=w[i];if(r<=0)return c[i]}return c[c.length-1];
}
function buildWorkout(day){
  const key=[day,zonesList().join(),S.level,S.tix,S.flex,Math.round(kgNow())].join('|');
  if(cache[key])return cache[key];
  const type=DAYT[(day-1)%7],lv=S.level,T=TIMES[S.tix].t,wk=Math.floor((day-1)/7)%4;
  const rng=mulberry(hash(key)),Z=zonesList();
  let work=[30,40,45][lv-1]+wk*2,rest=type==='hiit'?[20,20,15][lv-1]:[15,12,10][lv-1];
  if(type==='flow'){work+=5;rest+=3}
  if(type==='pilates'||type==='both')rest=Math.max(8,rest-3);
  const warmN=T>=30?2:T>=10?1:0;
  const steps=[],used=new Set();
  const warmPool=X.filter(e=>e.c[0]==='warm');
  const wsel=warmPool.slice().sort(()=>rng()-.5).slice(0,warmN);
  wsel.forEach(e=>{steps.push({ex:e,secs:30,rest:5,warm:true});used.add(e.id)});
  const budget=T*60-warmN*35;
  const n=Math.max(4,Math.round(budget/(work+rest)));
  const catFor=bi=>type==='cardio'?'cardio':type==='hiit'?'hiit':(type==='pilates'||type==='flow')?'pilates':(bi%2===0?'cardio':'pilates');
  let specs=[];
  if(n<=12){specs=type==='both'?[{cat:'cardio',k:Math.round(n*.4),rep:1},{cat:'pilates',k:n-Math.round(n*.4),rep:1}]:[{cat:catFor(0),k:n,rep:1}]}
  else{let rem=n,bi=0;while(rem>=4){const k=Math.min(8,Math.ceil(rem/2));specs.push({cat:catFor(bi),k,rep:2});rem-=k*2;bi++}}
  const zOff=Math.floor(rng()*Z.length);let zi=zOff;
  specs.forEach((sp,bi)=>{
    const pool=X.filter(e=>e.c.includes(sp.cat)&&e.c[0]!=='warm'&&(type!=='flow'||e.lv<=Math.min(lv,2)));
    let list=[];for(let j=0;j<sp.k;j++){const e=pickEx(pool,Z[zi++%Z.length],used,rng,type==='flow'?Math.min(lv,2):lv);used.add(e.id);list.push(e)}
    if(sp.cat==='pilates')list.sort((a,b)=>POSR[a.pos]-POSR[b.pos]);
    for(let r=1;r<=sp.rep;r++)list.forEach(e=>steps.push({ex:e,secs:work,rest,round:r,rounds:sp.rep,block:bi}));
  });
  let total=0;steps.forEach((s,i)=>{total+=s.secs+(i<steps.length-1?s.rest:0)});
  const kc=Math.round(steps.reduce((a,s)=>a+s.secs*MET[s.ex.c[0]]*kgNow()/3600,0)*[.9,1,1.1][lv-1]);
  const zs=[...new Set(steps.flatMap(s=>s.ex.z))].filter(z=>Z.includes(z));
  const wo={day,type,title:TYPES[type].n,steps,total,mins:Math.round(total/60),kcal:kc,zones:Z,covered:zs,work,rest};
  cache[key]=wo;return wo;
}
function buildCool(wo){
  const T=TIMES[S.tix].t,fx=S.flex;
  let n=T<10?3:T<20?4:T<30?5:T<40?6:8;if(wo.type==='flow')n+=2;
  const rng=mulberry(hash('cool'+wo.day+S.flex+S.zones.join())),Z=zonesList().slice();
  const pool=X.filter(e=>e.c[0]==='stretch'&&e.fx<=fx);
  const used=new Set(),sel=[];let zi=0;
  const gen=['back','glutes','thighs','waist'];
  while(sel.length<n){
    const z=zi<Z.length*2?Z[zi%Z.length]:gen[(zi-Z.length*2)%gen.length];zi++;
    let c=pool.filter(e=>e.z.includes(z)&&!used.has(e.id));
    if(!c.length){if(zi>40)break;continue}
    c.sort((a,b)=>(b.fx===fx)-(a.fx===fx)||rng()-.5);
    const e=c[0];used.add(e.id);sel.push(e);
  }
  sel.sort((a,b)=>POSR[a.pos]-POSR[b.pos]);
  const hold=[30,35,45][fx-1]+(wo.type==='flow'?5:0);
  const steps=sel.map(e=>({ex:e,secs:hold,rest:6}));
  const total=steps.reduce((a,s,i)=>a+s.secs+(i<steps.length-1?s.rest:0),0);
  return {day:wo.day,type:'cool',title:'Cool-down Stretch',steps,total,mins:Math.max(1,Math.round(total/60)),kcal:Math.round(total*MET.stretch*kgNow()/3600)};
}

/* ================= PLAYER ================= */
let P=null;
function startPlayer(wo,kind,onEnd){
  ensureAudio();
  const steps=[];
  steps.push({k:'ready',secs:5,ex:wo.steps[0].ex,idx:0,total:wo.steps.length});
  wo.steps.forEach((s,i)=>{
    steps.push({k:'work',secs:s.secs,ex:s.ex,idx:i,total:wo.steps.length,round:s.round,rounds:s.rounds,warm:s.warm});
    if(i<wo.steps.length-1)steps.push({k:'rest',secs:s.rest,ex:wo.steps[i+1].ex,idx:i,total:wo.steps.length});
  });
  P={wo,kind,steps,i:-1,left:0,paused:false,last:0,workT:0,kcal:0,onEnd,timer:null};
  P.timer=setInterval(tick,200);
  setStep(0);
}
function setStep(i){
  P.i=i;P.cur=P.steps[i];P.left=P.cur.secs;P.last=performance.now();P.lastSec=null;
  renderPlayer();
  if(P.cur.k==='work'){beep(880,.25);say(P.cur.ex.n)}
  else if(P.cur.k==='rest'){beep(520,.15);say('Rest. Next, '+P.cur.ex.n)}
  else say('Get ready')
}
function advance(){if(P.i+1>=P.steps.length)return endPlayer(true);setStep(P.i+1)}
function tick(){
  if(!P||P.paused)return;const now=performance.now(),dt=(now-P.last)/1000;P.last=now;P.left-=dt;
  if(P.cur.k==='work'){P.workT+=dt;P.kcal+=dt*MET[P.cur.ex.c[0]]*kgNow()/3600*[.9,1,1.1][S.level-1]}
  const sec=Math.ceil(P.left);if(sec!==P.lastSec){P.lastSec=sec;if(sec>0&&sec<=3)beep(660,.12);if(P.cur.k==='work'&&sec===Math.floor(P.cur.secs/2)&&P.cur.secs>=30)say('Halfway')}
  if(P.left<=0)advance();else updTimer();
}
function updTimer(){
  const c=document.getElementById('tnum'),r=document.getElementById('tring');if(!c)return;
  c.textContent=Math.ceil(Math.max(0,P.left));
  if(r){const L=2*Math.PI*56;r.setAttribute('stroke-dashoffset',L*(1-Math.max(0,P.left)/P.cur.secs))}
  const pr=document.getElementById('pbar');if(pr){const done=P.steps.slice(0,P.i).reduce((a,s)=>a+s.secs,0)+(P.cur.secs-P.left);const tot=P.steps.reduce((a,s)=>a+s.secs,0);pr.style.width=Math.min(100,done/tot*100)+'%'}
}
function renderPlayer(){
  const c=P.cur,L=2*Math.PI*56,e=c.ex,isRest=c.k==='rest';
  const next=P.steps.slice(P.i+1).find(s=>s.k==='work');
  const label=P.kind==='cool'?`Stretch ${c.idx+1}/${c.total}`:c.k==='ready'?'Get ready':`Move ${c.idx+1}/${c.total}${c.rounds>1?` · Round ${c.round}/${c.rounds}`:''}${c.warm?' · Warm-up':''}`;
  let main='';
  if(c.k==='ready')main=`<div style="text-align:center;margin-top:6px"><div class="tag">${P.kind==='cool'?'COOL-DOWN':'DAY '+P.wo.day}</div><h2 style="font-size:28px;margin:4px 0 12px">${P.wo.title}</h2></div>${figHTML(e.id)}<div class="pname">${e.n}</div><div class="ptip">First up</div><div class="big-n" id="tnum" style="font-size:72px;color:var(--pk)">${c.secs}</div>`;
  else if(isRest)main=`<div style="text-align:center;margin-top:10px"><div class="tag" style="color:#2a9d85">REST</div><div class="big-n" id="tnum" style="color:#2a9d85;margin:6px 0">${c.secs}</div><button class="btn sm ghost" data-a="plus20">+20s</button></div><div style="margin-top:14px">${figHTML(e.id)}</div><div class="pname" style="font-size:22px">Next: ${e.n}</div><div class="ptip">${e.tip}</div>`;
  else main=`${figHTML(e.id)}<div class="pname">${e.n}</div><div class="ptip">${e.tip}${P.kind==='cool'&&S.flex===1&&e.m?`<br><span style="color:#2a9d85">Gentle option: ${e.m}</span>`:''}</div><div class="ring"><svg width="128" height="128"><circle cx="64" cy="64" r="56" fill="none" stroke="#f3dfe5" stroke-width="10"/><circle id="tring" cx="64" cy="64" r="56" fill="none" stroke="#ff5c7c" stroke-width="10" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="0"/></svg><b id="tnum">${c.secs}</b></div>`;
  $('#layer').innerHTML=`<div class="player ${isRest?'rest':''}"><div class="ptop"><button class="x" data-a="quitask">✕</button><div class="prog"><i id="pbar" style="width:0"></i></div><span class="sub" style="font-size:12px;white-space:nowrap">${label}</span></div>${main}<div class="ctl"><button data-a="pprev">⏮</button><button class="big" data-a="ppause">${P.paused?'▶':'⏸'}</button><button data-a="pnext">⏭</button></div>${next&&!isRest&&c.k!=='ready'?`<div class="next"><div class="th" data-fig="${next.ex.id}"></div><span><small>NEXT UP</small>${next.ex.n}</span></div>`:''}</div>`;
  mountAll($('#layer'));updTimer();
}
function endPlayer(completed){
  clearInterval(P.timer);const p=P;P=null;try{speechSynthesis.cancel()}catch(e){}
  $('#layer').innerHTML='';
  if(completed)p.onEnd({secs:Math.round(p.workT),kcal:Math.round(p.kcal)});else render();
}

/* ================= COMPLETION ================= */
function record(wo,secs,kcal,type){
  const now=Date.now(),prev=S.log.filter(l=>l.type!=='cool').map(l=>l.ts);
  if(type!=='cool'){

const KGLB=2.20462;
const fromKg=kg=>S.wt.unit==='lb'?kg*KGLB:kg;
const toKg=v=>S.wt.unit==='lb'?v/KGLB:v;
const r1=v=>Math.round(v*10)/10;

const wEntries=()=>S.wt.entries.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
function kgNow(){const e=wEntries();return e.length?e[e.length-1].kg:60}
function okw(s,unit){const v=parseFloat(String(s).replace(',','.'));if(isNaN(v))return null;const kg=(unit||S.wt.unit)==='lb'?v/KGLB:v;return kg>=25&&kg<=350?kg:null}
function goalReached(){const g=S.wt.goal,s=S.wt.start,e=wEntries();if(g==null||s==null||!e.length||g===s)return false;const c=e[e.length-1].kg;return g<s?c<=g:c>=g}
function logWeight(kg,date){
  const d=date||ymd(Date.now()),i=S.wt.entries.findIndex(e=>e.d===d);
  if(i>=0)S.wt.entries[i].kg=kg;else S.wt.entries.push({d,kg});

  const nm=evalMedals();save();return nm;
}

function weightSheet(mode,keep){

  const cur=goal?(S.wt.goal!=null?r1(fromKg(S.wt.goal)):''):(e.length?r1(fromKg(e[e.length-1].kg)):'');
  const val=keep!=null?keep:cur;

function wChart(e){
  const pts=e.slice(-30);
  if(pts.length<2)return `<div class="sub" style="margin:10px 0">Log a few more days to see your trend.</div>`;
  const vals=pts.map(p=>fromKg(p.kg));if(S.wt.goal!=null)vals.push(fromKg(S.wt.goal));
  let mn=Math.min(...vals),mx=Math.max(...vals);if(mx-mn<1){mn-=.5;mx+=.5}
  const W=300,H=100,px=i=>8+i*(W-16)/(pts.length-1),py=v=>H-8-(v-mn)/(mx-mn)*(H-16);
  const line=pts.map((p,i)=>px(i).toFixed(1)+','+py(fromKg(p.kg)).toFixed(1)).join(' ');
  const g=S.wt.goal!=null?`<line x1="8" x2="${W-8}" y1="${py(fromKg(S.wt.goal))}" y2="${py(fromKg(S.wt.goal))}" stroke="#4fcfb1" stroke-width="2" stroke-dasharray="5 4"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:8px">${g}<polyline points="${line}" fill="none" stroke="#ff5c7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${px(i)}" cy="${py(fromKg(p.kg))}" r="3.5" fill="#ff5c7c"/>`).join('')}</svg>${S.wt.goal!=null?'<div class="note">Dashed line = your goal</div>':''}`;
}

    case 'settime':S.tix=+v;save();closeModal();render();break;
    case 'levelsheet':pickSheet('Fitness level',LEVELS,S.level-1,'setlevel');break;
    case 'setlevel':{const nl=+v+1;if(nl>S.level)S.flags.lvl=1;S.level=nl;const nm=evalMedals();save();closeModal();render();if(nm.length)toastMedal(nm);break}
    case 'flexsheet':pickSheet('Flexibility',FLEX,S.flex-1,'setflex');break;
    case 'setflex':S.flex=+v+1;save();closeModal();render();break;
    case 'zonesheet':zoneSheet();break;
    case 'zset':{const z=S.zones.length?S.zones.slice():Object.keys(ZONES);S.zones=z.includes(v)?(z.length>1?z.filter(x=>x!==v):z):[...z,v];save();zoneSheet();render();break}
    case 'namesheet':openModal(`<h3>Your name</h3><input class="tx" id="nm" maxlength="20" value="${esc(S.name)}"><div style="height:12px"></div><button class="btn" data-a="setname">Save</button>`);break;
    case 'setname':S.name=$('#nm').value.trim();save();closeModal();render();break;
    case 'tsound':S.sound=!S.sound;save();render();break;
    case 'tvoice':S.voice=!S.voice;save();render();if(S.voice)say('Voice coach on');break;
    case 'backup':backupSheet();break;
    case 'copybk':{const ta=$('#bk');ta.select();let ok=false;try{navigator.clipboard.writeText(ta.value).then(()=>{$('#bkmsg').textContent='Copied!'},()=>{$('#bkmsg').textContent='Select the code and copy it manually.'});ok=true}catch(e){}if(!ok)$('#bkmsg').textContent='Select the code and copy it manually.';break}
    case 'restore':{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#rs').value.trim()))));if(!o||o.v!==1)throw 0;S={...fresh(),...o};save();closeModal();tab='home';render()}catch(e){$('#bkmsg').textContent='That code did not work. Please check it and try again.'}break}
    case 'resetask':confirmBox('Reset everything?','This deletes all progress, medals and settings on this device.','Yes, reset','reset');break;
    case 'reset':S=fresh();save();ob={step:0,name:'',zones:[],level:null,flex:null,tix:null,unit:'kg',cur:'',goal:''};closeModal();tab='home';planBlock=null;render();break;
    case 'start':{ensureAudio();closeModal();const d=+v;if(d>nextDay())break;const wo=buildWorkout(d);lastWo=wo;
      startPlayer(wo,'work',res=>{lastRes=res;const nm=record(wo,res.secs,res.kcal,wo.type);showSummary(wo,res,nm)});break}
    case 'startcool':{const wo=lastWo,cw=buildCool(wo);startPlayer(cw,'cool',res=>{const nm=record(wo,res.secs,res.kcal,'cool');showCoolDone(cw,res,nm)});break}
    case 'finishdone':$('#layer').innerHTML='';tab='home';planBlock=null;render();window.scrollTo(0,0);break;
    case 'fb':{document.querySelectorAll('#fb button').forEach(b=>b.classList.toggle('on',b===t));const el=$('#fbmsg');
      if(v==='1'&&S.level>1)el.innerHTML=`<button class="btn sm ghost" data-a="lvlchg" data-v="-1" style="margin-bottom:12px">Make it easier next time</button>`;
      else if(v==='-1'&&S.level<3)el.innerHTML=`<button class="btn sm ghost" data-a="lvlchg" data-v="1" style="margin-bottom:12px">Make it harder next time</button>`;
      else el.innerHTML=`<div class="sub" style="margin-bottom:12px">Thanks! We'll keep it steady.</div>`;break}
    case 'lvlchg':{const nl=S.level+(+v);if(nl>S.level)S.flags.lvl=1;S.level=nl;const nm=evalMedals();save();$('#fbmsg').innerHTML=`<div class="sub" style="margin-bottom:12px">Done! Now at ${LEVELS[S.level-1].n}. ${nm.length?'🏅 New medal: '+nm[0].n:''}</div>`;break}
    case 'quitask':{if(P){P.paused=true;figs.forEach(f=>f.paused=true)}confirmBox('Quit workout?','Your progress for this session will not be saved.','Quit','quit');break}
    case 'quit':closeModal();endPlayer(false);break;
    case 'ppause':P.paused=!P.paused;P.userPaused=P.paused;P.last=performance.now();figs.forEach(f=>f.paused=P.paused);document.querySelector('[data-a=ppause]').textContent=P.paused?'▶':'⏸';break;
    case 'pnext':advance();break;
    case 'pprev':{let j=P.i-1;while(j>0&&P.steps[j].k!=='work')j--;setStep(Math.max(0,j));break}
    case 'libmore':libLim+=48;{const y=scrollY;render();scrollTo(0,y)}break;
    case 'libtg':libTg=v;libLim=48;render();break;
    case 'libpos':libPos=v;libLim=48;render();break;
    case 'wlog':weightSheet('log');break;
    case 'wgoal':weightSheet('goal');break;
    case 'wunit':{const [u,m]=v.split('|');S.wt.unit=u;save();weightSheet(m);render();break}
    case 'wsave':{const kg=okw(($('#wv').value||''));if(kg==null){toast('Please enter a valid weight');break}
      const nm=logWeight(kg,$('#wd').value||ymd(Date.now()));closeModal();render();toast('Weight saved ✓');if(nm.length)toastMedal(nm);break}
    case 'wgoalsave':{const kg=okw(($('#wv').value||''));if(kg==null){toast('Please enter a valid weight');break}
      S.wt.goal=kg;if(S.wt.start==null&&S.wt.entries.length)S.wt.start=wEntries()[0].kg;const nm=evalMedals();save();closeModal();render();if(nm.length)toastMedal(nm);break}
    case 'wdel':confirmBox('Delete this entry?','It will be removed from your weight log.','Delete','wdelok',v);break;
    case 'wdelok':S.wt.entries=S.wt.entries.filter(e=>e.d!==v);save();closeModal();render();break;
    case 'act':A={k:v,i:1,mins:'',dist:''};actSheet();break;
    case 'actlv':A.mins=($('#amin')||{value:''}).value;A.dist=($('#adist')||{value:''}).value;A.i=+v;actSheet();break;
    case 'actsave':{const mins=parseFloat(A.mins);if(!(mins>0)){toast('Enter how many minutes');break}
      const a=ACTS.find(x=>x.k===A.k),d=parseFloat(String(A.dist).replace(',','.'));const km=d>0?(S.wt.unit==='lb'?d*1.609:d):0;
      const kcal=actKcal();S.log.push({day:0,ts:Date.now(),secs:Math.round(mins*60),kcal,type:'act',name:a.n,km});
      const nm=evalMedals();save();closeModal();render();toast(a.e+' '+kcal+' kcal logged');if(nm.length)setTimeout(()=>toastMedal(nm),600);break}
    case 'actdel':confirmBox('Delete this activity?','It will be removed from your calories and totals.','Delete','actdelok',v);break;
    case 'actdelok':S.log=S.log.filter(l=>String(l.ts)!==v);save();closeModal();render();break;
    case 'acttimer':{A.mins=($('#amin')||{value:''}).value;closeModal();AT={k:A.k,acc:0,run:true,t0:Date.now()};renderTimer();AT.iv=setInterval(updActTimer,500);break}
    case 'atpause':{if(AT.run){AT.acc+=Date.now()-AT.t0;AT.run=false}else{AT.t0=Date.now();AT.run=true}document.getElementById('atbtn').textContent=AT.run?'⏸':'▶';break}
    case 'atfinish':{const m=Math.max(1,Math.round(elapsedAT()/60000));clearInterval(AT.iv);A.mins=String(m);AT=null;$('#layer').innerHTML='';actSheet();break}
    case 'attcancel':clearInterval(AT.iv);AT=null;$('#layer').innerHTML='';break;
    case 'health':healthSheet();break;
    case 'copyhl':{const ta=$('#hl');ta.select();let ok=false;try{navigator.clipboard.writeText(ta.value).then(()=>{$('#hlmsg').textContent='Copied!'},()=>{$('#hlmsg').textContent='Select the text and copy it manually.'});ok=true}catch(e){}if(!ok)$('#hlmsg').textContent='Select the text and copy it manually.';break}
    case 'obunit':obReadW();ob.unit=v;ob.cur='';ob.goal='';renderOnb();break;
    case 'obskipw':ob.cur='';ob.goal='';ob.step=7;renderOnb();break;
    case 'plus20':P.left+=20;P.cur.secs+=20;updTimer();break;
  }
});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.id==='libq'){libQ=t.value;libLim=48;const l=$('#liblist');if(l){l.innerHTML=libItems();mountAll(l)}}
  if(t.id==='amin'||t.id==='adist'){A.mins=($('#amin')||{value:''}).value;A.dist=($('#adist')||{value:''}).value;const k=$('#akc');if(k)k.innerHTML=actKcal()+' <small style="font-size:14px">kcal</small>'}
});
// closing the quit dialog resumes the workout
new MutationObserver(()=>{if(P&&P.paused&&!$('#modal').innerHTML&&!P.userPaused){P.paused=false;P.last=performance.now();figs.forEach(f=>f.paused=false)}}).observe($('#modal'),{childList:true});
function toastMedal(list){openModal(medalPop(list)+`<button class="btn" data-a="close">Awesome</button>`)}

render();
</script>
</body>
</html>
